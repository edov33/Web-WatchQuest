<!DOCTYPE html>
<html lang="it">

<head>
    <link rel="icon" type="image/ico" href="/immagini/favicon.ico">
    <title>WatchQuest</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/general_styles.css">
    <link rel="stylesheet" href="/css/settings.css">
</head>

<body>
    <header>
        <button id="menu-button" onclick="showNav()" type="button">
            <img id="menu-option" class="menu-icon" src="/immagini/menu-icon.png">
        </button>
        <img src="/immagini/watchquest-logo.png" id="watchquest" class="img-fluid">
        <h1 id="nome-progetto">WatchQuest</h1>
        <form id="search-form">
            <input class="form-control" list="cronologia" id="search" placeholder="Type to search...">
            <datalist id="cronologia">
                <option value="Beccatevi sto trapezioh"></option>
            </datalist>
        </form>
        <div id="search-b-div">
            <button class="search-b"><i class="bi bi-search"></i></button>
            <button id="adv-src-b" class="search-b" onclick=""><i class="bi bi-chevron-down"></i></button>
        </div>

        <div id="otherlinks-box">
            <h6 class="otherlinks"><a href="/aboutus" id="aboutus" class="text-decoration-none">About Us</a></h6>
            <h6 class="otherlinks"><a href="/joinus" id="joinus" class="text-decoration-none">Join Us</a></h6>
            <h6 class="otherlinks"><a href="/faq" class="text-decoration-none">FAQ</a></h6>
            <img id="profile-icon" th:src="${loggato} ? ${foto} : '/immagini/profile-icon-no-bg.png'">
        </div>
        <nav id="navBar">
            <button onclick='window.location.href="/home"' id="home-nav" class="nav-option"><i
                    class="bi bi-house nav-icon"></i>
                <h2 class="nav-link">Home</h2>
            </button>
            <button onclick='window.location.href="/myLists"' id="mylists-nav" class="nav-option"><i
                    class="bi bi-heart  nav-icon"></i>
                <h2 class="nav-link">My Lists</h2>
            </button>
            <button onclick='window.location.href="/news"' id="news-nav" class="nav-option"><i
                    class="bi bi-newspaper  nav-icon"></i>
                <h2 class="nav-link">News</h2>
            </button>
            <button onclick='window.location.href="/quiz"' id="quiz-nav" class="nav-option"><i
                    class="bi bi-question-diamond  nav-icon"></i>
                <h2 class="nav-link">Quiz</h2>
            </button>
            <button onclick='window.location.href="/settings"' id="settings-nav" class="nav-option"><i
                    class="bi bi-gear  nav-icon"></i>
                <h2 class="nav-link">Settings</h2>
            </button>
        </nav>
        <div id="adv-search">
            <form id="adv-src-form">
                <label id="find-by">Find by:
                    <label>Film</label>
                    <input id="fb-film" type="radio" name="find-by" value="film" class="fb-radio-opt">
                    <label>Actor</label>
                    <input id="fb-actor" type="radio" name="find-by" value="actor" class="fb-radio-opt">
                </label>
                <label class="adv-select-lbl">Categoria:
                    <select id="categoria" class="adv-select">
                        <option value=""></option>
                    </select>
                </label>
                <label class="adv-select-lbl">Genere:
                    <select id="genere" class="adv-select">
                        <option value=""></option>
                    </select>
                </label>
            </form>
        </div>
        <div id="login-pop">
            <form action="#" method="post" th:action="@{/login/attempt}">
                <input type="hidden" id="session" th:value="${loggato}">
                <label class="login-lb"> Username:
                    <input type="text" class="login" name="username">
                </label>
                <label class="login-lb"> Password:
                    <input type="password" class="login" name="password">
                </label>
                <div id="login-bgroup">
                    <button type="submit" id="login-b" class="btn btn-primary login-b">Login</button>
                    <a th:href="${loggato} ? '/logout' : '/registrazione'">
                        <button type="button" id="signup-b" class="btn btn-primary login-b">
                            <span th:text="${loggato} ? 'Logout' : 'Sign Up'"></span>
                        </button>
                    </a>
                </div>

            </form>
        </div>
    </header>
    <main th:object="${utente}">
        <div class="contenitore">
            <div class="profilo-container">
                <img id="img-profilo" class="profilo-img" th:src="${utente.foto_profilo}" alt="Foto profilo">

                <div class="profilo-info">
                    <table>
                        <tbody>
                            <tr>
                                <th>Nome:</th>
                                <td class="profilo" th:text="${utente.nome}">NOME UTENTE</td>
                            </tr>
                            <tr>
                                <th>Cognome:</th>
                                <td class="profilo" th:text="${utente.cognome}">COGNOME UTENTE</td>
                            </tr>
                            <tr>
                                <th>Data nascita:</th>
                                <td class="profilo" th:text="${utente.data_nascita}">DATA NASCITA UTENTE</td>
                            </tr>
                            <tr>
                                <th>Username:</th>
                                <td class="profilo" th:text="${utente.username}">USERNAME UTENTE</td>
                            </tr>
                            <tr>
                                <th>Email:</th>
                                <td class="profilo" th:text="${utente.email}">EMAIL UTENTE</td>
                            </tr>
                        </tbody>
                    </table>

                    <button class="profilo-btn" th:attr="
                        data-modifica-id = ${utente.id},
                        data-modifica-nome = ${utente.nome},
                        data-modifica-cognome = ${utente.cognome},
                        data-modifica-data_nascita = ${utente.data_nascita},
                        data-modifica-username = ${utente.username},
                        data-modifica-password = ${utente.password},
                        data-modifica-email = ${utente.email},
                        data-modifica-lingua = ${utente.lingua}"
                        onclick="document.getElementById('modifica').style.display='flex' ; modificaUtente(this)">
                        Modifica
                    </button>
                </div>
            </div>
        </div>

        <div id="form-modifica" hidden>
            <div class="modal" id="modifica" style="display:flex;">
                <div id="modal-add" class="modal-content">

                    <h4>Modifica</h4>
                    <form action="/utente/modifica" method="post">
                        <label for="modifica-id">Id</label>
                        <input type="number" name="id" id="modifica-id" readonly> <br>
                        <label for="modifica-nome">Nome:</label>
                        <input type="text" name="nome" id="modifica-nome"> <br>
                        <label for="modifica-cognome">Cognome:</label>
                        <input type="text" name="cognome" id="modifica-cognome"> <br>
                        <label for="modifica-data_nascita">Data nascita:</label>
                        <input type="date" name="data_nascita" id="modifica-data_nascita"> <br>
                        <label for="modifica-username">Username:</label>
                        <input type="text" name="username" id="modifica-username"> <br>
                        <label for="modifica-password">Password:</label>
                        <input type="password" name="password" id="modifica-password"> <br>
                        <label for="modifica-email">E-mail:</label>
                        <input type="email" name="email" id="modifica-email"> <br>
                        <label for="modifica-lingua">Lingua:</label>
                        <input type="text" name="lingua" id="modifica-lingua"> <br>
                        <label for="modifica-foto_profilo">Foto profilo:</label>
                        <input type="text" name="foto_profilo" id="modifica-foto_profilo"> <br>

                        <input type="submit" value="modifica">
                    </form>
                </div>
            </div>
        </div>
    </main>
    <footer class="bd-footer py-4 py-md-5 mt-5">
        <div id="contatti">
            Contatti:
            <br>+39 3346895395
            <br>watchquest@gmail.com
            <br>Milano, Via Roma 5
        </div>
        <div id="canaliSocial">
            Canali social:
            <br><i class="bi bi-facebook social_img"></i>
            <h5 class="social-link">WatchQuest</h5>
            <br><i class="bi bi-instagram social_img"></i>
            <h5 class="social-link">@watchquest</h5>
            <br><i class="bi bi-youtube social_img"></i>
            <h5 class="social-link">WatchQuest</h5>
        </div>
        <div>
            <h6 class="otherlinks"><a href="/admin/all" class="text-decoration-none">Admin</a></h6>
        </div>
    </footer>
</body>
<script src="/js/generalscripts.js"></script>
<script src="/js/settings.js"></script>
<script src="/js/controlli.js"></script>

</html>
